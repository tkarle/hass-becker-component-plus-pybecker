# Becker services

pair:
  description: "Pair with a cover receiver, when master transmitter is in pairing mode"
  fields:
    channel:
      description: "Channel to pair the receiver on (1-7)"
      example: 1
    unit:
      description: "Sender unit to use for pairing (1-5)"
      example: 1
log_units:
  description: "Log all configured/paired units"
set_known_position:
  name: "Set known position"
  description: "Correct the estimated cover position without sending a radio command."
  target:
    entity:
      integration: becker
      domain: cover
  fields:
    position:
      name: "Known position"
      description: "The physically observed position: 0 is closed and 100 is open."
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
move_down_intermediate:
  name: "Move to programmed DOWN intermediate position"
  description: >-
    Send the Becker DOWN2 command to move the receiver to its programmed
    intermediate position, such as a stored sun-protection position.
  target:
    entity:
      integration: becker
      domain: cover
move_to_sun_protection:
  name: "Move to sun-protection position"
  description: >-
    Move a roller shutter to its configured sun-protection percentage, or
    send DOWN2 to a venetian blind that has no percentage configured.
  target:
    entity:
      integration: becker
      domain: cover
